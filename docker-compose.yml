services:
  api:
    build: .
    image: disaster-response-backend:latest
    container_name: drrc-backend
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/instance/disaster_response.db
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - drrc_data:/app/instance   # persists the SQLite database across restarts/rebuilds
    restart: unless-stopped

volumes:
  drrc_data:
